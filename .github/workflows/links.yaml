name: Check links

on:
  schedule:
    - cron: '41 6 * * 1'   # every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HUGO_VERSION: 0.170.0
  ISSUE_TITLE: Broken links on the site

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          curl -sSLo "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the site
        run: hugo build --gc
      - name: Check the links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn and X answer bots with an error even when the page is fine.
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --exclude 'linkedin\.com' --exclude 'twitter\.com' --exclude 'x\.com'
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            'public/**/*.html'
          output: lychee-report.md
          fail: false
      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file lychee-report.md
          else
            gh issue create --title "${ISSUE_TITLE}" --body-file lychee-report.md
          fi
