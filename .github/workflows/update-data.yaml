name: Update data

on:
  schedule:
    - cron: '23 5 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Refresh episodes and pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_data.py || echo "::warning::One of the sources could not be reached, the old data was kept"
      - name: Commit the changes
        run: |
          if [ -z "$(git status --porcelain data/auto)" ]; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto
          git commit -m "chore: refresh episodes and merged pull requests"
          git push
