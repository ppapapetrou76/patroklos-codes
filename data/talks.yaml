# Talks and workshops, newest first. To add one, copy an entry and put it at the top of "items".
section:
  kind: "Speaker"
  title: "Talks and workshops"
  summary: "GitOps, Argo CD, code quality and remote teams, at ArgoCon, PlatformCon, DevTernity and more"
  state: "since 2013"
  open: true
intro: >-
  I started speaking at conferences around 2013. These days I mostly talk about GitOps, Argo CD and
  continuous delivery, and I still enjoy a session on code quality, code reviews or remote teams.
  I do talks, hands-on workshops and panels, and I've been on the other side of the call for papers
  for ten years, so I know what an organizer needs from a speaker.
outro_html: >-
  I've also spoken at I T.A.K.E. Unconference in Bucharest and many local meetups.
  <a href="https://sessionize.com/pat/">My Sessionize profile</a> and
  <a href="https://speakerdeck.com/ppapapetrou76">my slides on Speaker Deck</a> have more.
