readme_html: >-
  I've been writing software for more than 25 years<sup>1</sup>, for Greek and international companies,
  and remotely since 2013. I tried engineering management for a year and came back to writing
  code<sup>2</sup>. I call myself a software gardener<sup>3</sup>, because a codebase needs the same
  daily care a garden does. I live in Thessaloniki<sup>4</sup>.
readme_notes:
  - "Lead Open Source Engineer at Octopus Deploy today, Principal Software Engineer at Elastic before that."
  - "It's the part of the job I like most."
  - "From my talk, The Art of Software Gardening."
  - "Where I started the local Java meetup and later the conferences that grew out of it."
